[project]
site_name = "tvfeed"
site_description = "Programme télé personnel construit à partir de chaînes YouTube."
nav = [
  { "Accueil" = "index.md" },
  { "Fonctionnement" = "fonctionnement.md" },
]

[project.theme]
language = "fr"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Passer en mode clair"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Passer en mode sombre"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Suivre le thème du système"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.tabbed.alternate_style = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

# Référence d'API générée depuis les docstrings (style Google).
[project.plugins.mkdocstrings]
default_handler = "python"
locale = "fr"
custom_templates = "templates"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = true
show_root_heading = true
members_order = "source"
separate_signature = true
show_signature_annotations = true

# Une page de référence par module, ajoutée automatiquement à la navigation.
[project.plugins.api-autonav]
modules = ["src/tvfeed"]
nav_section_title = "Référence API"
